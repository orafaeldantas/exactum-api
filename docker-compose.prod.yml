services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: exactum_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - exactum_network

  api:
    build: ./backend
    container_name: exactum_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    #expose:
    #  - "5000"
    networks:
      - exactum_network

  db:
    image: postgres:15
    container_name: exactum_db
    restart: unless-stopped
    ports:
      - "${DB_PORT_MAPPING}"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - exactum_network

  redis:
    image: redis:8-alpine
    container_name: exactum_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - exactum_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  pgdata:

networks:
  exactum_network:
