[project]
name = "exactum-backend"
version = "0.1.0"
description = "Sistema ERP Web para gestão de estoque, vendas e PDV de pequenos e médios comércios."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.0",
    "Flask-JWT-Extended==4.7.1",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "flask-marshmallow==1.5.0",
    "flask-smorest==0.47.0",
    "marshmallow==4.3.0",
    "marshmallow-sqlalchemy==1.5.0",
    "psycopg2-binary==2.9.11",
    "python-dotenv>=1.2.2",
    "gunicorn==26.0.0",
    "redis>=8.0.0",
    "uuid6>=2025.0.1",
    "msgpack>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "coverage==7.14.1",
    "ruff==0.15.14",
    "pip-audit>=2.10.0",
    "mypy>=2.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = []

[tool.ruff.format]

quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
allow_subclassing_any = true

disallow_untyped_defs = false  
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "flask_sqlalchemy.*",
    "flask_migrate.*",
    "flask_smorest.*",
    "flask_cors.*"
]
ignore_missing_imports = true
