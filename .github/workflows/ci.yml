name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check .